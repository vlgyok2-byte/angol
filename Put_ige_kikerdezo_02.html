<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angol szóbeli gyakorló</title>
<style>
body {
    font-family: Arial, sans-serif;
    max-width: 900px;
    margin: auto;
    padding: 20px;
    transition: 0.3s;
    background: #ffffff;
    color: #111111;
}

body.dark {
    background: #222;
    color: #eee;
}

.panel {
    padding: 10px;
    background: #f0f0f0;
    border-radius: 8px;
    margin-bottom: 10px;
}

body.dark .panel {
    background: #333;
}

.choice {
    display: block;
    width: 100%;
    margin: 8px 0;
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
    border: none;
    font-size: 16px;
    background: #e9e9e9;
    color: inherit;
    transition: 0.2s;
}

.choice:hover:enabled {
    filter: brightness(0.96);
}

body.dark .choice {
    background: #444;
    color: #eee;
}

.choice:disabled {
    cursor: not-allowed;
    opacity: 0.95;
}

.correct {
    background: #4CAF50 !important;
    color: white !important;
}

.wrong {
    background: #f44336 !important;
    color: white !important;
}

#timer {
    font-size: 24px;
    font-weight: bold;
    color: #d32f2f;
}

#question {
    font-size: 22px;
    margin: 20px 0 10px;
    min-height: 56px;
}

#result {
    margin: 12px 0;
    font-weight: bold;
    min-height: 24px;
}

.controls-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
}

button {
    padding: 10px 14px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

button:hover {
    filter: brightness(0.97);
}

body.dark button {
    background: #444;
    color: #eee;
}
</style>
</head>
<body>
<h1>Angol szóbeli gyakorló</h1>

<div class="panel">
    <div class="controls-row">
        <label><input type="radio" name="mode" value="en-to-hu" checked> Angol -> Magyar</label>
        <label><input type="radio" name="mode" value="hu-to-en"> Magyar -> Angol</label>
        <button type="button" onclick="toggleDark()">🌙 Sötét mód</button>

        <label for="rate">Sebesség:</label>
        <select id="rate">
            <option value="0.7">Lassú</option>
            <option value="0.85" selected>Normál</option>
            <option value="1">Gyors</option>
        </select>
    </div>
</div>

<div id="question"></div>
<button type="button" onclick="repeatQuestion()">🔊 Ismétlés</button>

<div id="answers"></div>
<div id="result"></div>

<p>⏳ Hátralévő idő: <span id="timer">8</span> mp</p>
<p>Kérdés: <span id="current">0</span>/<span id="total">0</span></p>
<p>Pont: <span id="score">0</span></p>
<p>Teljesítmény: <span id="percent">0</span>%</p>

<div class="controls-row">
    <button type="button" onclick="stopQuiz()">⛔ Teszt leállítása</button>
    <button id="wrongOnlyBtn" style="display:none" type="button" onclick="retryWrong()">Csak hibás kérdések újra</button>
    <button type="button" onclick="resetQuiz()">🔄 Újrakezdés</button>
</div>

<script>
const originalQuestions = [
{q:"I will put the book on the table.",a:"Az asztalra fogom tenni a könyvet.",w:["Leveszem a könyvet az asztalról.","A polcra fogom tenni a könyvet."]},
{q:"You can put the box on the floor.",a:"A dobozt a padlóra teheted.",w:["A dobozt az asztalra teheted.","Vidd ki a dobozt."]},
{q:"Don't put your coat on the chair.",a:"Ne tedd a kabátodat a székre.",w:["Vedd fel a kabátodat.","Tedd a kabátodat az ágyra."]},
{q:"She put a lot of time into this project.",a:"Sok időt fektetett ebbe a projektbe.",w:["Sok pénzt keresett ezzel a projekttel.","Gyorsan befejezte a projektet."]},
{q:"I put all my energy into studying.",a:"Minden energiámat a tanulásba fektettem.",w:["Abbahagytam a tanulást.","Sokat pihentem tanulás helyett."]},
{q:"You have to put a lot of work into learning English.",a:"Sok munkát kell fektetned az angoltanulásba.",w:["Sok pénzt kell költened angolra.","Nem kell sokat tanulnod."]},
{q:"How can I put this politely?",a:"Hogyan mondhatnám ezt udvariasan?",w:["Hogyan írhatnám ezt le?","Hogyan fordítsam ezt?"]},
{q:"Let me put it another way.",a:"Hadd mondjam másképp.",w:["Hadd ismételjem el.","Hadd írjam le."]},
{q:"She couldn't put her thoughts into words.",a:"Nem tudta szavakba önteni a gondolatait.",w:["Nem tudott írni.","Nem értette a kérdést."]},
{q:"Please put your answer simply.",a:"Kérlek, egyszerűen fogalmazd meg a válaszodat.",w:["Kérlek, írd le a válaszodat.","Kérlek, mondd hangosabban a válaszodat."]},
{q:"I don't know how to put my feelings into words.",a:"Nem tudom szavakba önteni az érzéseimet.",w:["Nem értem az érzéseimet.","Nem akarok beszélni az érzéseimről."]},
{q:"Could you put that differently?",a:"El tudnád mondani másképp?",w:["Le tudnád írni?","Meg tudnád ismételni?"]},
{q:"She put the problem very clearly.",a:"Nagyon világosan fogalmazta meg a problémát.",w:["Gyorsan megoldotta a problémát.","Elfelejtette a problémát."]},
{q:"I'll try to put it in a better way.",a:"Megpróbálom jobban megfogalmazni.",w:["Megpróbálom lefordítani.","Megpróbálom lerövidíteni."]},
{q:"Can you put your question more clearly?",a:"Meg tudnád világosabban fogalmazni a kérdésedet?",w:["Meg tudnád ismételni a kérdésedet?","Le tudnád írni a kérdésedet?"]},
{q:"He couldn't put his ideas into words.",a:"Nem tudta szavakba önteni a gondolatait.",w:["Nem értett egyet az ötletekkel.","Nem emlékezett az ötleteire."]},
{q:"Let me put it in a different way.",a:"Hadd fogalmazzam meg másképp.",w:["Hadd írjam le.","Hadd ismételjem meg."]},
{q:"She always puts things politely.",a:"Mindig udvariasan fogalmaz.",w:["Mindig hangosan beszél.","Mindig gyorsan válaszol."]},
{q:"I don't know how to put this.",a:"Nem tudom, hogyan fogalmazzam meg ezt.",w:["Nem tudom, hogyan írjam le ezt.","Nem tudom, hogyan fordítsam ezt."]},
{q:"They put their opinions very honestly.",a:"Nagyon őszintén fogalmazták meg a véleményüket.",w:["Nem mondták el a véleményüket.","Udvariasan hallgattak."]},
{q:"Could you put that in writing?",a:"Le tudnád ezt írni?",w:["El tudnád ezt mondani?","Le tudnád ezt fordítani?"]},
{q:"We should put our plans on paper.",a:"Papírra kell vetnünk a terveinket.",w:["El kell halasztanunk a terveinket.","Meg kell változtatnunk a terveinket."]},
{q:"She put the situation very well.",a:"Nagyon jól fogalmazta meg a helyzetet.",w:["Gyorsan megoldotta a helyzetet.","Elrontotta a helyzetet."]},
{q:"How would you put this in English?",a:"Hogyan mondanád ezt angolul?",w:["Hogyan írnád ezt le?","Hogyan fordítanád ezt magyarra?"]},
{q:"How can I put this?",a:"Hogyan fogalmazzam meg ezt?",w:["Hová tegyem ezt?","Hogyan írjam ezt alá?"]},
{q:"How would you put this?",a:"Te hogyan fogalmaznád meg ezt?",w:["Hová tennéd ezt?","Hogyan fordítanád ezt magyarra?"]},
{q:"Could you put that differently?",a:"El tudnád mondani másképp?",w:["Le tudnád írni?","El tudnád ismételni?"]},
{q:"I can't put it into words.",a:"Nem tudom szavakba önteni.",w:["Nem tudom leírni.","Nem akarom elmondani."]},
{q:"Put it on paper.",a:"Vesd papírra!",w:["Tedd az asztalra!","Dobd ki!"]},
{q:"Put it in writing.",a:"Írd le!",w:["Mondd el!","Fordítsd le!"]},
{q:"I can't put this well.",a:"Nem tudom ezt jól megfogalmazni.",w:["Nem tudom ezt jól leírni.","Nem tudom ezt elolvasni."]},
{q:"Could you put this more simply?",a:"Egyszerűbben meg tudnád fogalmazni ezt?",w:["Hangosabban el tudnád mondani?","Le tudnád írni ezt?"]},
{q:"The teacher put it very clearly.",a:"A tanár nagyon világosan fogalmazta meg.",w:["A tanár gyorsan elmagyarázta.","A tanár megismételte."]},
{q:"Try to put it differently.",a:"Próbáld meg másképp megfogalmazni!",w:["Próbáld meg leírni!","Próbáld meg lefordítani!"]},
{q:"How would you put this in English?",a:"Hogyan mondanád ezt angolul?",w:["Hogyan írnád ezt angolul?","Hogyan fordítanád ezt magyarra?"]},
{q:"Can you put your feelings into words?",a:"Szavakba tudod önteni az érzéseidet?",w:["Le tudod rajzolni az érzéseidet?","El tudod rejteni az érzéseidet?"]},
{q:"She put her answer very politely.",a:"Nagyon udvariasan fogalmazta meg a válaszát.",w:["Nagyon gyorsan válaszolt.","Nem válaszolt udvariasan."]},
{q:"I will put my thoughts on paper.",a:"Papírra fogom vetni a gondolataimat.",w:["El fogom felejteni a gondolataimat.","Hangosan felolvasom a gondolataimat."]},
{q:"He didn't want to put it so strongly.",a:"Nem akarta ilyen erősen megfogalmazni.",w:["Nem akarta megismételni.","Nem akarta leírni."]},
{q:"The student put his opinion well.",a:"A diák jól fogalmazta meg a véleményét.",w:["A diák megváltoztatta a véleményét.","A diák nem mondta el a véleményét."]}
];

let questions = [];
let wrongQuestions = [];
let wrongQuestionKeys = new Set();
let index = 0;
let score = 0;
let lastText = "";
let lastLang = "en-US";
let timer = null;
let timeLeft = 8;
let quizEnded = false;
let waitingNextQuestion = false;

function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
}

function mode() {
    return document.querySelector('input[name="mode"]:checked').value;
}

function getQuestionKey(question) {
    return `${question.q}|||${question.a}`;
}

function addWrongQuestion(question) {
    const key = getQuestionKey(question);
    if (!wrongQuestionKeys.has(key)) {
        wrongQuestionKeys.add(key);
        wrongQuestions.push(question);
    }
}

function safeCancelSpeech() {
    if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
    }
}

function speak(text, lang) {
    if (!("speechSynthesis" in window)) return;

    safeCancelSpeech();

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = lang;
    utterance.rate = parseFloat(document.getElementById("rate").value) || 0.85;

    window.speechSynthesis.speak(utterance);
    lastText = text;
    lastLang = lang;
}

function repeatQuestion() {
    if (!quizEnded && lastText) {
        speak(lastText, lastLang);
    }
}

function toggleDark() {
    document.body.classList.toggle("dark");
}

function updateStats() {
    document.getElementById("score").textContent = score;
    document.getElementById("current").textContent = Math.min(index + 1, questions.length);
    document.getElementById("total").textContent = questions.length;

    const answered = index;
    const pct = answered > 0 ? Math.round((score / answered) * 100) : 0;
    document.getElementById("percent").textContent = pct;
}

function resetQuiz() {
    clearInterval(timer);
    safeCancelSpeech();

    questions = [...originalQuestions];
    shuffle(questions);

    wrongQuestions = [];
    wrongQuestionKeys = new Set();
    index = 0;
    score = 0;
    timeLeft = 8;
    quizEnded = false;
    waitingNextQuestion = false;

    document.getElementById("timer").textContent = timeLeft;
    document.getElementById("wrongOnlyBtn").style.display = "none";
    document.getElementById("result").textContent = "";

    updateStats();
    showQuestion();
}

function disableChoices() {
    document.querySelectorAll(".choice").forEach(btn => {
        btn.disabled = true;
    });
}

function startTimer(correct) {
    clearInterval(timer);
    timeLeft = 8;
    document.getElementById("timer").textContent = timeLeft;

    timer = setInterval(() => {
        timeLeft--;
        document.getElementById("timer").textContent = timeLeft;

        if (timeLeft <= 0) {
            clearInterval(timer);

            if (quizEnded || waitingNextQuestion) return;

            disableChoices();
            addWrongQuestion(questions[index]);

            document.getElementById("result").textContent =
                "⏰ Lejárt az idő! Helyes válasz: " + correct;

            const lang = mode() === "en-to-hu" ? "hu-HU" : "en-US";
            speak(correct, lang);

            waitingNextQuestion = true;
            index++;
            updateStats();

            setTimeout(() => {
                waitingNextQuestion = false;
                if (!quizEnded) showQuestion();
            }, 3000);
        }
    }, 1000);
}

function getWrongOptionsForHuToEn(correct) {
    const pool = originalQuestions
        .map(item => item.q)
        .filter(item => item !== correct);

    shuffle(pool);
    return pool.slice(0, 2);
}

function showQuestion() {
    if (quizEnded) return;

    if (index >= questions.length) {
        clearInterval(timer);
        quizEnded = true;

        const pct = questions.length > 0 ? Math.round((score / questions.length) * 100) : 0;

        document.getElementById("question").innerHTML = "<h2>Vége!</h2>";
        document.getElementById("answers").innerHTML = "";
        document.getElementById("result").textContent =
            "Eredmény: " + score + "/" + questions.length + " (" + pct + "%)";
        document.getElementById("percent").textContent = pct;
        document.getElementById("timer").textContent = "0";

        localStorage.setItem("lastResult", String(pct));

        if (wrongQuestions.length > 0) {
            document.getElementById("wrongOnlyBtn").style.display = "inline-block";
        }
        return;
    }

    const q = questions[index];
    let questionText;
    let correct;
    let wrongs;
    let lang;

    if (mode() === "en-to-hu") {
        questionText = q.q;
        correct = q.a;
        wrongs = [...q.w];
        lang = "en-US";
    } else {
        questionText = q.a;
        correct = q.q;
        wrongs = getWrongOptionsForHuToEn(correct);
        lang = "hu-HU";
    }

    document.getElementById("question").textContent = questionText;
    document.getElementById("result").textContent = "";

    speak(questionText, lang);

    const options = [correct, ...wrongs];
    shuffle(options);

    const answersDiv = document.getElementById("answers");
    answersDiv.innerHTML = "";

    options.forEach(option => {
        const btn = document.createElement("button");
        btn.className = "choice";
        btn.type = "button";
        btn.textContent = option;
        btn.addEventListener("click", () => checkAnswer(btn, option, correct));
        answersDiv.appendChild(btn);
    });

    updateStats();
    startTimer(correct);
}

function highlightCorrectAnswer(correct) {
    document.querySelectorAll(".choice").forEach(button => {
        if (button.textContent === correct) {
            button.classList.add("correct");
        }
    });
}

function checkAnswer(btn, selected, correct) {
    if (quizEnded || waitingNextQuestion) return;

    clearInterval(timer);
    disableChoices();

    const lang = mode() === "en-to-hu" ? "hu-HU" : "en-US";

    if (selected === correct) {
        score++;
        btn.classList.add("correct");
        document.getElementById("result").textContent = "✓ Helyes!";
    } else {
        btn.classList.add("wrong");
        highlightCorrectAnswer(correct);
        addWrongQuestion(questions[index]);
        document.getElementById("result").textContent = "✗ Hibás! Helyes válasz: " + correct;
    }

    speak(correct, lang);

    waitingNextQuestion = true;
    index++;
    updateStats();

    setTimeout(() => {
        waitingNextQuestion = false;
        if (!quizEnded) showQuestion();
    }, 2500);
}

function stopQuiz() {
    if (quizEnded) return;

    if (!confirm("Biztosan befejezed a tesztet?")) return;

    clearInterval(timer);
    safeCancelSpeech();
    quizEnded = true;
    waitingNextQuestion = false;

    disableChoices();

    const answered = index;
    const pct = answered > 0 ? Math.round((score / answered) * 100) : 0;

    document.getElementById("question").innerHTML = "<h2>A teszt megszakítva.</h2>";
    document.getElementById("answers").innerHTML = "";
    document.getElementById("result").textContent =
        "Eredmény: " + score + "/" + answered + " (" + pct + "%)";
    document.getElementById("percent").textContent = pct;
    document.getElementById("timer").textContent = "0";

    if (wrongQuestions.length > 0) {
        document.getElementById("wrongOnlyBtn").style.display = "inline-block";
    }
}

function retryWrong() {
    clearInterval(timer);
    safeCancelSpeech();

    if (wrongQuestions.length === 0) return;

    questions = [...wrongQuestions];
    shuffle(questions);

    wrongQuestions = [];
    wrongQuestionKeys = new Set();
    index = 0;
    score = 0;
    timeLeft = 8;
    quizEnded = false;
    waitingNextQuestion = false;

    document.getElementById("timer").textContent = timeLeft;
    document.getElementById("wrongOnlyBtn").style.display = "none";
    document.getElementById("result").textContent = "";

    updateStats();
    showQuestion();
}

document.querySelectorAll('input[name="mode"]').forEach(radio => {
    radio.addEventListener("change", resetQuiz);
});

resetQuiz();
</script>
</body>
</html>
